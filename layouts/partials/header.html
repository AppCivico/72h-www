{{ partial "siteNav.html" . }}

<div class="outdated" v-cloak :hidden="!dataIsOutdated">
  <div class="container">
    <p>
      {{ i18n "oldInfo" }}
      <span v-if="mainData">{{ " {{ epochToHuman(mainData.epoch) }}" }}</span>
      {{ i18n "oldInfoUpdate" | safeHTML }}
    </p>
    <button
      @click="closeWarning"
      aria-label="{{ i18n "closeWarning" }}"
      class="outdated__close">
    </button>
  </div>
</div>
