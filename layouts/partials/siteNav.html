<header class="main-header">
  <div class="container">
    <p class="main-header__logo-heading">
      <a class="main-header__logo" href="/">{{ .Site.Params.name }}</a>
    </p>

    <button class="hamburger hamburger--squeeze js-menu-toggle" type="button">
      <span class="hamburger-box">
        <span class="hamburger-inner"></span>
      </span>
    </button>

    <div class="main-header__links js-menu-area">
      {{ with .Site.Menus.header }}
        {{ range . }}
          <a
            class="main-header__link"
            href="{{ .URL }}"
            {{- if (hasPrefix .URL "http") }} target="_blank" rel="noopener"{{ end }}>
              {{ .Name }}
          </a>
        {{ end }}
      {{ end }}

      {{ with hugo.Data.socialMedia }}
        <ul class="social social--header">
          {{ range .list }}
            <li>
              <a href="{{ .url }}" title="{{ .name }}" rel="noopener" class="{{ .name }}" target="_blank">
                {{ .name }}
              </a>
            </li>
          {{ end }}
        </ul>
      {{ end }}
    </div>
  </div>

</header>
