{{ partial "head.html" . }}
<body>
  {{ partial "siteNav.html" . }}

  <main>
    <div class="container container--small">
      <article>
        <h1>{{ .Title }}</h1>
        {{ .Content }}
      </article>
    </div>
  </main>

  {{ partial "footer.html" . }}

  {{ $contentPageJS := resources.Get "scripts/content-page.js" | js.Build (dict "target" "es2017") | resources.Minify | resources.Fingerprint "sha512" }}
  <script type="text/javascript" src="{{ $contentPageJS.RelPermalink }}" integrity="{{ $contentPageJS.Data.Integrity }}"></script>
</body>
</html>
