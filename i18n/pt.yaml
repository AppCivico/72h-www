  translation: "Os números abaixo vêm de uma coleta anterior, feita quando o painel somava Fundo Eleitoral e Fundo Partidário. A próxima atualização recalcula tudo somente com o Fundo Eleitoral."
- id: painelRulerIntro
  translation: "Em 2026, o Fundo Eleitoral também tem regra específica de destinação para candidaturas indígenas. Este painel compara, neste momento, as regras relativas a mulheres e a pessoas pretas e pardas."
- id: painelRulerBlackLegal
  translation: "Constituição Federal, art. 17, § 9º, incluído pela EC 133/2024; Resolução TSE nº 23.607/2019, art. 17, § 4º, II, com redação da Resolução nº 23.752/2026."
