- id: painelTl1932
  translation: "O Código Eleitoral garante às mulheres o direito de votar e de ser votadas."
- id: painelTl1933
  translation: "Carlota Pereira de Queiroz é eleita a primeira deputada federal do Brasil. Sozinha."
- id: painelTl1995
  translation: "Surgem as cotas de candidaturas. Em 1995, a lei estabeleceu pelo menos 20% das vagas para candidaturas de mulheres nas eleições municipais de 1996. Em 1997, a Lei das Eleições criou a regra geral por sexo, com percentual de transição de 25% para as eleições de 1998 e 30% nas eleições seguintes."
- id: painelTl2009
  translation: "A lei troca 'reservar' por 'preencher'. Os partidos passam a ter de preencher efetivamente o mínimo de 30% e o máximo de 70% das candidaturas de cada sexo."
- id: painelTl2018
  translation: "O STF determina que os recursos do Fundo Partidário destinados às campanhas de mulheres acompanhem a proporção de candidaturas femininas do partido, observado o piso mínimo de 30%. Em seguida, o TSE aplica a mesma regra ao Fundo Eleitoral e ao tempo de propaganda gratuita no rádio e na televisão."
- id: painelTl2020
  translation: "O TSE estende às candidaturas de pessoas negras a regra da distribuição proporcional de recursos públicos de campanha e do tempo de propaganda. O STF confirma sua aplicação já nas eleições daquele ano. Essa regra seria alterada em 2024 pela Emenda Constitucional 133, que passou a estabelecer um piso mínimo de 30%."
- id: painelTl2021
  translation: "A Emenda Constitucional 111 determina que, nas eleições de 2022 a 2030, os votos dados a candidaturas de mulheres e de pessoas negras para a Câmara dos Deputados sejam contados em dobro para fins de distribuição do Fundo Partidário e do Fundo Eleitoral entre os partidos."
- id: painelTl2022
  translation: "A Emenda Constitucional 117 incorpora à Constituição a garantia de pelo menos 30% dos recursos públicos de campanha para candidaturas femininas, proporcionalmente ao número de candidatas."
- id: painelTl2024
  translation: "A Emenda Constitucional 133 estabelece na Constituição que 30% dos recursos públicos destinados às campanhas devem ser aplicados em candidaturas de pessoas pretas e pardas."
- id: painelTl2026
  translation: "O STF mantém a validade da EC 133 ao julgar improcedentes as ADIs 7.706 e 7.707. O piso de 30% vale nas eleições deste ano."
- id: painelHistoryBenchmark
  translation: "Para espelhar a população, seriam cerca de 264 deputadas (51,5% de 513). O recorde, em 2022, foi 91."
- id: painelHistorySource
  translation: "Fontes: Câmara dos Deputados, Senado Federal e TSE. O ano de 1994 foi omitido por falta de série oficial confiável; 1990 usa a contagem por legislatura e pode incluir suplentes."
