  translation: "As regras de distribuição do Fundo Eleitoral"
- id: painelRulerBlackTitle
  translation: "para candidaturas de pessoas pretas e pardas"
- id: painelRulerBlackBody
  translation: "Piso mínimo de 30%: pelo menos 30% do Fundo Eleitoral recebido pelo partido deve ser destinado a candidaturas de pessoas pretas e pardas, independentemente da proporção dessas candidaturas."
- id: painelRulerWomenTitle
  translation: "para candidaturas de mulheres"
- id: painelRulerWomenBody
  translation: "O percentual do Fundo Eleitoral destinado às mulheres deve acompanhar a proporção de candidaturas femininas do partido e nunca pode ser inferior a 30%. Na tabela deste painel, cada partido é comparado com o seu próprio piso; no gráfico de tempo, a linha de referência é o mínimo de 30%."
- id: painelRulerDeadlineTitle
  translation: "para o prazo final de distribuição dos recursos das cotas"
- id: painelRulerDeadlineBody
  translation: "Os partidos têm até 8 de setembro para concluir a distribuição dos recursos destinados às candidaturas de mulheres, pessoas pretas e pardas e indígenas. A lei permite que os repasses sejam feitos até essa data. Este painel mostra quando eles acontecem, porque o momento da distribuição também importa: recursos que chegam mais tarde deixam menos tempo para que as candidaturas possam utilizá-los durante a campanha."
- id: painelRulerDeadlinePast
