- id: painelTimelineEyebrow
  translation: "Como chegamos até aqui"
- id: painelTimelineTitle
  translation: "Noventa anos para ir de 1 a 91 deputadas"
- id: painelTimelineIntro
  translation: "A sub-representação não é acaso: é história. Cada regra da linha do tempo abaixo nasceu porque a anterior não bastou."
- id: painelTl1932
  translation: "O Código Eleitoral garante às mulheres o direito de votar e de ser votadas."
- id: painelTl1933
  translation: "Carlota Pereira de Queiroz é eleita a primeira deputada federal do Brasil. Sozinha."
- id: painelTl1997
  translation: "A lei passa a exigir um mínimo de candidaturas por sexo: 20% em 1995, 30% em 1997. Mas o verbo era 'reservar': bastava deixar a vaga em aberto."
- id: painelTl2009
  translation: "O verbo muda para 'preencher': os 30% de candidaturas viram obrigação de verdade."
- id: painelTl2018
  translation: "O TSE decide que no mínimo 30% do dinheiro público e do tempo de rádio e TV devem ir para candidaturas de mulheres."
- id: painelTl2020
  translation: "TSE e STF estendem a régua à raça: recursos proporcionais para candidaturas negras, valendo já naquela eleição."
- id: painelTl2021
  translation: "Emenda Constitucional 111: votos dados a mulheres e a pessoas negras eleitas para a Câmara contam em dobro na divisão dos fundos, até 2030."
- id: painelTl2022
  translation: "Emenda Constitucional 117 leva os 30% para mulheres à Constituição."
- id: painelTl2024
  translation: "Emenda Constitucional 133 fixa um piso de 30% dos fundos para candidaturas de pessoas pretas e pardas."
- id: painelTl2026
  translation: "O STF confirma a regra ao julgar as ADIs 7706 e 7707. É a régua desta eleição."
- id: painelHistoryBenchmark
  translation: "Para espelhar a população, seriam cerca de 264 deputadas (51,5% de 513). O recorde, em 2022, foi 91."
- id: painelHistorySource
  translation: "Fontes: Câmara dos Deputados, Senado Federal e TSE. O ano de 1994 foi omitido por falta de série oficial confiável; 1990 usa a contagem por legislatura e pode incluir suplentes."
