  translation: "Resolução TSE nº 23.771/2026."
- id: painelWhySumulaSummary
  translation: "Saiba mais: como a Justiça Eleitoral identifica uma candidatura fictícia"
- id: painelWhySumulaBody
  translation: "A Súmula 73 do TSE reúne elementos que podem caracterizar fraude à cota de gênero, como votação zerada ou inexpressiva, prestação de contas zerada ou padronizada, ausência de movimentação financeira relevante e ausência de atos efetivos de campanha, de divulgação ou de promoção da candidatura."
- id: painelWhyMattersEyebrow
  translation: "Por que isso importa?"
- id: painelWhyMattersTitle
  translation: "Piso mínimo não é teto, e cumprir a regra não é o mesmo que distribuir bem"
- id: painelWhyMattersP1
  translation: "A legislação estabelece percentuais mínimos para a destinação de recursos públicos a determinados grupos sub-representados de candidaturas. Esses percentuais representam pisos mínimos, e não limites máximos."
- id: painelWhyMattersP2
  translation: "Além disso, a lei verifica a distribuição considerando o conjunto das candidaturas de cada grupo, e não quanto recebe cada candidatura individualmente. Isso significa que um partido pode cumprir formalmente a legislação e, ainda assim, concentrar grande parte dos recursos em poucas candidaturas."
- id: painelWhyMattersP3
  translation: "Por isso, acompanhar como o dinheiro é distribuído é tão importante quanto verificar quanto foi destinado a cada grupo. A forma de distribuição influencia as condições reais de competição eleitoral e amplia o debate sobre igualdade de oportunidades na democracia."
