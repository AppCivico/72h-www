- id: painelMethodEyebrow
  translation: "Como medimos"
- id: painelMethodTitle
  translation: "Metodologia"
- id: painelMethodP1
  translation: "Este painel acompanha exclusivamente a distribuição do Fundo Eleitoral (FEFC). Os valores e percentuais apresentados são calculados a partir dos recursos do Fundo Eleitoral declarados pelas candidaturas como recebidos. Embora regras semelhantes também se apliquem aos recursos do Fundo Partidário utilizados em campanhas, optamos por acompanhar apenas o Fundo Eleitoral para permitir comparações mais claras e consistentes entre os partidos."
- id: painelMethodP2
  translation: "A fatia de cada grupo é calculada sobre o Fundo Eleitoral declarado pelas candidaturas como recebido até a última coleta, e não sobre a cota total recebida pelo partido. Os percentuais mostram como os recursos já distribuídos estão sendo divididos entre os grupos analisados. O recorte racial considera a autodeclaração informada à Justiça Eleitoral (pessoas pretas e pardas). Partidos que ainda não atingiram R$ 250 mil em repasses do Fundo Eleitoral aparecem na seção 'Quase nada distribuído até agora', pois, abaixo desse valor, os percentuais ainda podem não representar o padrão de distribuição de recursos do partido ao longo da campanha."
- id: painelMethodP3
  translation: "Todos os dados de financiamento utilizados pelo 72horas são baseados exclusivamente nas informações declaradas pelas candidaturas à Justiça Eleitoral. Declarações feitas por partidos ou diretórios não são utilizadas como base para os indicadores da plataforma. Como existe prazo para atualização das prestações de contas, um repasse realizado hoje pode aparecer apenas nas próximas coletas. Mesmo nas federações, os recursos são atribuídos ao partido responsável pelo repasse. Os percentuais apresentados nesta página acompanham o ritmo e a distribuição dos recursos ao longo da campanha e não representam, antes do prazo legal e da análise da prestação de contas pela Justiça Eleitoral, uma conclusão sobre o cumprimento ou descumprimento da legislação eleitoral."
