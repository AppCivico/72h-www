- id: painelWhyEyebrow
  translation: "Por que vigiar o dinheiro"
- id: painelWhyTitle
  translation: "Cota de candidatura sem dinheiro virou candidatura de papel"
- id: painelWhyP1
  translation: "Durante duas décadas, a regra brasileira exigia candidatas, mas não exigia que elas tivessem recursos para fazer campanha. O resultado foram as chamadas candidaturas laranja: nomes registrados só para fechar a conta dos 30%, sem campanha, sem dinheiro e quase sem votos."
- id: painelWhyP2a
  translation: "Dois casos marcaram a virada: em"
- id: painelWhyCase1
  translation: "Valença do Piauí, o TSE cassou uma chapa inteira de vereadores"
- id: painelWhyP2b
  translation: " por fraude à cota de gênero (2019); e em 2018, o esquema de "
- id: painelWhyCase2
  translation: "candidatas laranja do PSL em Minas Gerais"
- id: painelWhyP2c
  translation: " mostrou que até dinheiro público repassado a candidaturas fictícias podia voltar por caminhos suspeitos."
- id: painelWhyP3
  translation: "Por isso a lei passou a mirar o dinheiro: não basta registrar candidaturas, é preciso financiá-las. E como quem distribui é o partido, é o partido que esta página observa."
- id: painelRulerEyebrow
  translation: "A régua de 2026"
- id: painelRulerTitle
  translation: "Duas regras, um prazo"
- id: painelRulerBlackTitle
  translation: "para candidaturas de pessoas pretas e pardas"
- id: painelRulerBlackBody
  translation: "Piso fixo: no mínimo 30% dos fundos públicos de campanha de cada partido (EC 133/2024, confirmada pelo STF em junho de 2026), independentemente de quantas candidaturas negras o partido tenha."
- id: painelRulerWomenTitle
  translation: "para candidaturas de mulheres"
- id: painelRulerWomenBody
  translation: "No mínimo 30% dos fundos públicos, e proporcional quando as candidatas passam de 30% das candidaturas do partido (Consulta TSE de 2018; EC 117/2022). Aqui comparamos com o piso."
- id: painelRulerDeadlineTitle
  translation: "para o prazo legal dos repasses mínimos"
- id: painelRulerDeadlineBody
  translation: "Os partidos têm até 8 de setembro para repassar os valores mínimos reservados a candidaturas de mulheres e de pessoas negras e indígenas. Cumprir só na véspera é legal; esta página mostra quem escolhe esse caminho."
- id: painelRulerDeadlinePast
  translation: "O prazo legal terminou em 8 de setembro. Os números abaixo mostram como cada partido chegou (ou não) lá."
