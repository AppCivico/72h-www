- id: painelWhyEyebrow
  translation: "Por que vigiar o dinheiro"
- id: painelWhyTitle
  translation: "Cota de candidatura sem dinheiro virou candidatura de papel"
- id: painelWhyP1
  translation: "Durante anos, a legislação estabeleceu cotas de candidaturas sem prever uma destinação mínima de recursos para essas campanhas. Nesse contexto, foram identificados muitos casos de candidaturas femininas registradas apenas formalmente para atingir o percentual exigido, as chamadas candidaturas fictícias ou 'laranja'."
- id: painelWhyP2a
  translation: "Dois casos julgados pela Justiça Eleitoral ajudam a entender: em"
- id: painelWhyCase1
  translation: "Valença do Piauí, o TSE manteve a cassação de vereadores por fraude à cota de gênero"
- id: painelWhyP2b
  translation: " (2019); e em Divinópolis, em Minas Gerais, o TSE reconheceu "
- id: painelWhyCase2
  translation: "fraude à cota de gênero praticada pelo PSL nas eleições de 2020"
- id: painelWhyP2c
  translation: "."
- id: painelWhyP3
  translation: "A partir de 2018, as políticas afirmativas passaram a alcançar também o financiamento das campanhas. Além das cotas de candidatura, parte dos recursos públicos passou a ter destinação obrigatória para esses grupos. E como quem distribui é o partido, é o partido que esta página observa."
