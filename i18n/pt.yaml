- id: painelMethodEyebrow
  translation: "Como medimos"
- id: painelMethodTitle
  translation: "Metodologia, em três parágrafos"
- id: painelMethodP1
  translation: "Contamos apenas dinheiro público (Fundo Eleitoral e Fundo Partidário somados), porque é sobre ele que as regras de 30% incidem. Os dois fundos são somados de propósito: nas primeiras entregas ao TSE, o rótulo que separa um do outro é impreciso."
- id: painelMethodP2
  translation: "A fatia de cada grupo é calculada sobre o que o partido efetivamente repassou a candidaturas até a última coleta, não sobre a cota que recebeu. Recorte racial por autodeclaração ao TSE (pessoas pretas e pardas, como na EC 133). Partido sem repasse não aparece com 0%: aparece como sem dados, na lista de quem quase nada distribuiu."
- id: painelMethodP3
  translation: "Os números mudam todos os dias durante a campanha e podem ser retificados pelos próprios candidatos. Esta página não afirma descumprimento de lei: registra o ritmo e o destino dos repasses declarados. O prazo legal para os mínimos de cota é 8 de setembro; antes disso, estar abaixo de 30% não é infração."
