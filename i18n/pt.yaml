# Usada quando a listagem volta vazia mas os números grandes do MESMO recorte
# contam candidaturas: aí o vazio é falha de carga, não ausência de repasse.
# Nunca afirmar que não houve repasse quando a própria página mostra que houve.
- id: listingUnavailable
  translation: "Não foi possível carregar a listagem agora. Os números acima seguem válidos: este recorte tem candidaturas com repasse declarado."
# Chamada da cota de gênero, sob o card de gênero da home. Dois estados, e o
# número que decide qual deles aparece vem do painel dos partidos (FEFC).
# A linguagem é deliberadamente "abaixo do piso até aqui": prestação de contas
# ainda não aconteceu e o repasse pode continuar, então nada aqui afirma
# descumprimento.
# Duas réguas diferentes, e a distinção não é preciosismo: 30% é o mínimo
# legal, e o piso de cada partido é proporcional às candidaturas de mulheres
# que ele registrou. Um partido pode estar acima dos 30% e abaixo do próprio
# piso (o PT, em 30/08/2026, estava em 32,4% com piso de 36,8%), então as
# frases nunca podem usar os dois termos como sinônimos.
# O sujeito é sempre a CANDIDATURA: quem declara ao TSE é ela, nunca o
# partido. Agregado por partido é derivado dessas declarações, então
# nenhuma frase pode dizer "os partidos declararam".
- id: quotaBelowLead
  translation: "No Fundo Eleitoral, as candidaturas de mulheres declararam ter recebido"
- id: quotaBelowTail
  translation: "do total, abaixo do mínimo de 30% até aqui. Os partidos que mais pesam nessa diferença:"
- id: quotaMetLead
  translation: "No Fundo Eleitoral, as candidaturas de mulheres já declararam ter recebido"
- id: quotaMetMiddle
  translation: "do total, acima do mínimo de 30%. Ainda assim, em"
- id: quotaMetTail
  translation: "partidos com volume relevante o valor declarado pelas candidatas fica abaixo do piso proporcional. Puxam o conjunto para cima:"
