[build]
  publish = "public"
  command = "curl -sfLO \"https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz\" && mkdir -p \"${HOME}/.local\" && tar -C \"${HOME}/.local\" -xf \"dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz\" && rm \"dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz\" && export PATH=\"${HOME}/.local/dart-sass:${PATH}\" && export HUGO_BASEURL=\"${URL}\" && hugo version && npm install && npm run build"

[build.environment]
  HUGO_VERSION = "0.164.0"

  # MITIGAÇÃO TEMPORÁRIA, ligada em 04/09/2026. Desliga as chamadas que o
  # build faz à API (ver layouts/partials/fetchRemote.html). Não é economia de
  # rede, é de relógio: com o /v1/index devolvendo 502 para os anos anteriores
  # e para reelection=1, são onze chamadas insistindo um minuto cada, e o build
  # do Netlify estourava o limite antes de terminar. O site parou de publicar.
  #
  # O preço é que a home sai sem os números de pré-hidratação e a isca do
  # rodapé sai sem cifra. O Vue continua buscando os números no cliente, então
  # quem abre a página com JavaScript vê tudo normalmente.
  #
  # REMOVER assim que o backend consertar o /v1/index. É uma linha só.
  HUGO_SKIP_REMOTE = "1"
  DART_SASS_VERSION = "1.101.0"
  NODE_VERSION = "24.18.0"

[context.dev.environment]
  HUGO_ENVIRONMENT = "staging"

# 853k+ unique candidates -- Hugo can't pre-generate a page per id, so
# /candidato/{id}/ all resolve to the same static shell page, and the
# candidate id is read client-side from window.location.pathname
# (assets/scripts/candidato.js fetches /v1/candidates/{id}/history).
[[redirects]]
  from = "/candidato/*"
  to = "/candidato/index.html"
  status = 200

# The shell above is identical for every candidate; this edge function
# rewrites its <head> (title, description, canonical, og:*, JSON-LD) with
# the candidate's own data before the HTML leaves the edge, so search
# engines and link previews finally see each candidate as a page of its
# own. See netlify/edge-functions/candidato-meta.js.
[[edge_functions]]
  path = "/candidato/*"
  function = "candidato-meta"
